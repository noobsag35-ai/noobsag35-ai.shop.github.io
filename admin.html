<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>پنل مدیریتی</title>

<style>
body{
  background:#020617;
  color:#fff;
  font-family:sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.box{
  width:380px;
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(16px);
  border-radius:20px;
  padding:20px;
  text-align:center;
}

input,select,button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  border:none;
  font-size:14px;
}

button{
  background:linear-gradient(135deg,#22c55e,#4ade80);
  font-weight:bold;
  cursor:pointer;
}

.admin-panel{display:none}

.card{
  background:rgba(255,255,255,.08);
  padding:12px;
  border-radius:14px;
  margin-top:10px;
  font-size:13px;
}

.del{
  background:#ef4444;
  color:#000;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="box">

  <!-- لاگین -->
  <div id="loginBox">
    <h3>🔐 ورود ادمین</h3>
    <input id="user" placeholder="نام کاربری">
    <input id="pass" type="password" placeholder="پسورد">
    <button onclick="login()">ورود</button>
  </div>

  <!-- پنل -->
  <div id="panel" class="admin-panel">
    <h3>🎛 پنل مدیریتی شاپ</h3>

    <!-- افزودن دسته -->
    <input id="newCat" placeholder="➕ نام دسته‌بندی جدید">
    <button onclick="addCategory()">افزودن دسته‌بندی</button>

    <!-- لیست دسته -->
    <div id="catList"></div>

    <hr style="margin:12px 0">

    <!-- افزودن محصول -->
    <input id="pname" placeholder="نام محصول">
    <input id="pprice" placeholder="قیمت">
    <input id="pimg" placeholder="لینک عکس">

    <select id="pcat"></select>

    <input id="pdesc" placeholder="توضیحات">

    <button onclick="saveProduct()">➕ افزودن محصول</button>
    <button onclick="clearProducts()" class="del">🗑 حذف همه محصولات</button>

    <div id="productList"></div>

    <a href="shop.html" style="color:#4ade80;display:block;margin-top:10px">
      🛒 رفتن به شاپ
    </a>
  </div>

</div>

<script>
/* اطلاعات ورود */
const USER = "IRadmin46";
const PASS = "Admin1234567890";

/* لاگین */
function login(){
  if(user.value === USER && pass.value === PASS){
    loginBox.style.display="none";
    panel.style.display="block";
    loadCategories();
    loadProducts();
  }else{
    alert("❌ اطلاعات ورود اشتباه است");
  }
}

/* ===== دسته‌بندی ===== */
function loadCategories(){
  let cats = JSON.parse(localStorage.getItem("categories")) || [];
  pcat.innerHTML = "";
  catList.innerHTML = "";

  cats.forEach((c,i)=>{
    pcat.innerHTML += `<option value="${c}">${c}</option>`;
    catList.innerHTML += `
      <div class="card">
        📦 ${c}
        <button class="del" onclick="deleteCategory(${i})">حذف</button>
      </div>`;
  });
}

function addCategory(){
  let cats = JSON.parse(localStorage.getItem("categories")) || [];
  if(!newCat.value) return;

  cats.push(newCat.value);
  localStorage.setItem("categories",JSON.stringify(cats));
  newCat.value="";
  loadCategories();
}

function deleteCategory(i){
  let cats = JSON.parse(localStorage.getItem("categories"));
  cats.splice(i,1);
  localStorage.setItem("categories",JSON.stringify(cats));
  loadCategories();
}

/* ===== محصولات ===== */
function saveProduct(){
  let products = JSON.parse(localStorage.getItem("products")) || [];

  products.push({
    id:Date.now(),
    name:pname.value,
    price:pprice.value,
    img:pimg.value,
    cat:pcat.value,
    desc:pdesc.value
  });

  localStorage.setItem("products",JSON.stringify(products));
  alert("✅ محصول اضافه شد");
  loadProducts();
}

function loadProducts(){
  let products = JSON.parse(localStorage.getItem("products")) || [];
  productList.innerHTML="";

  products.forEach((p,i)=>{
    productList.innerHTML += `
      <div class="card">
        <b>${p.name}</b><br>
        💰 ${p.price} تومان<br>
        📦 ${p.cat}
        <button class="del" onclick="deleteProduct(${i})">❌ حذف</button>
      </div>`;
  });
}

function deleteProduct(i){
  let products = JSON.parse(localStorage.getItem("products"));
  products.splice(i,1);
  localStorage.setItem("products",JSON.stringify(products));
  loadProducts();
}

function clearProducts(){
  if(confirm("همه محصولات حذف شوند؟")){
    localStorage.removeItem("products");
    loadProducts();
  }
}
</script>

</body>
</html>
