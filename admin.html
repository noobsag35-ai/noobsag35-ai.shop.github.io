<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>پنل مدیریتی</title>

<style>
body{
  background:#020617;
  color:#fff;
  font-family:sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.box{
  width:360px;
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(16px);
  border-radius:20px;
  padding:20px;
  text-align:center;
}

input,select,button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  border:none;
  font-size:14px;
}

button{
  background:linear-gradient(135deg,#22c55e,#4ade80);
  font-weight:bold;
  cursor:pointer;
}

.admin-panel{display:none}

.product{
  background:rgba(255,255,255,.08);
  padding:10px;
  border-radius:12px;
  margin-top:8px;
  font-size:13px;
}
.del{
  margin-top:6px;
  background:#ef4444;
  color:#fff;
}
</style>
</head>

<body>

<div class="box">

<!-- لاگین -->
<div id="loginBox">
  <h3>🔐 ورود ادمین</h3>
  <input id="user" placeholder="نام کاربری">
  <input id="pass" type="password" placeholder="پسورد">
  <button onclick="login()">ورود</button>
</div>

<!-- پنل -->
<div id="panel" class="admin-panel">
  <h3>🎛 پنل مدیریتی</h3>

  <input id="pname" placeholder="نام محصول">
  <input id="pprice" placeholder="قیمت">
  <input id="pimg" placeholder="لینک عکس">
  
  <!-- دسته بندی -->
  <select id="pcat">
    <option value="">انتخاب دسته بندی</option>
    <option>VIP</option>
    <option>ماشین</option>
    <option>اسلحه</option>
    <option>سکه</option>
    <option>سایر</option>
  </select>

  <input id="pdesc" placeholder="توضیحات">

  <button onclick="saveProduct()">➕ افزودن محصول</button>
  <button onclick="clearProducts()" style="background:#ef4444">🗑 حذف همه</button>

  <h4 style="margin-top:12px">📦 محصولات ثبت‌شده</h4>
  <div id="list"></div>

  <a href="shop.html" style="color:#4ade80;display:block;margin-top:10px">
    رفتن به شاپ
  </a>
</div>

</div>

<script>
const USER="admin", PASS="1234";

function login(){
  if(user.value===USER && pass.value===PASS){
    loginBox.style.display="none";
    panel.style.display="block";
    loadProducts();
  }else alert("❌ نام کاربری یا پسورد اشتباه است");
}

function saveProduct(){
  if(!pname.value||!pcat.value)return alert("همه فیلدها رو پر کن");

  let products=JSON.parse(localStorage.getItem("products"))||[];
  products.push({
    name:pname.value,
    price:pprice.value,
    img:pimg.value,
    cat:pcat.value,
    desc:pdesc.value
  });
  localStorage.setItem("products",JSON.stringify(products));
  loadProducts();
  alert("✅ محصول اضافه شد");
}

function loadProducts(){
  let products=JSON.parse(localStorage.getItem("products"))||[];
  list.innerHTML="";
  products.forEach((p,i)=>{
    list.innerHTML+=`
      <div class="product">
        <b>${p.name}</b><br>
        💰 ${p.price} | 📁 ${p.cat}
        <button class="del" onclick="deleteProduct(${i})">❌ حذف</button>
      </div>`;
  });
}

function deleteProduct(i){
  let products=JSON.parse(localStorage.getItem("products"));
  products.splice(i,1);
  localStorage.setItem("products",JSON.stringify(products));
  loadProducts();
}

function clearProducts(){
  if(confirm("همه محصولات حذف شوند؟")){
    localStorage.removeItem("products");
    loadProducts();
  }
}
</script>

</body>
</html>
