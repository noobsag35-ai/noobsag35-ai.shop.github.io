<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>پنل مدیریت شاپ</title>

<style>
body{
  font-family:sans-serif;
  background:#020617;
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
.box{
  width:360px;
  background:rgba(255,255,255,.1);
  padding:20px;
  border-radius:20px;
  box-shadow:0 0 40px rgba(0,0,0,.6);
}
input,textarea,button{
  width:100%;
  margin:8px 0;
  padding:12px;
  border-radius:12px;
  border:none;
}
button{
  background:#22c55e;
  font-weight:bold;
  cursor:pointer;
}
.hidden{display:none}
.logout{
  background:#ef4444;
}
</style>
</head>

<body>

<div class="box" id="loginBox">
  <h3>🔐 ورود ادمین</h3>
  <input id="user" placeholder="نام کاربری">
  <input id="pass" type="password" placeholder="رمز عبور">
  <button onclick="login()">ورود</button>
</div>

<div class="box hidden" id="panel">
  <h3>🛒 مدیریت محصول</h3>
  <input id="name" placeholder="نام محصول">
  <input id="price" placeholder="قیمت">
  <input id="img" placeholder="لینک عکس">
  <textarea id="desc" placeholder="توضیحات"></textarea>

  <button onclick="save()">💾 ذخیره محصول</button>
  <button class="logout" onclick="logout()">🚪 خروج</button>
</div>

<script>
const USER = "IRadmin46";
const PASS = "Admin1234567890";

function login(){
  if(user.value === USER && pass.value === PASS){
    loginBox.classList.add("hidden");
    panel.classList.remove("hidden");
    load();
  }else{
    alert("❌ اطلاعات ورود اشتباه است");
  }
}

function save(){
  const product = {
    name: name.value,
    price: price.value,
    img: img.value,
    desc: desc.value
  };

  localStorage.setItem("shopProduct", JSON.stringify(product));
  alert("✅ اطلاعات محصول ذخیره شد");
}

function load(){
  const p = JSON.parse(localStorage.getItem("shopProduct"));
  if(!p) return;
  name.value = p.name;
  price.value = p.price;
  img.value = p.img;
  desc.value = p.desc;
}

function logout(){
  panel.classList.add("hidden");
  loginBox.classList.remove("hidden");
}
</script>

</body>
</html>
