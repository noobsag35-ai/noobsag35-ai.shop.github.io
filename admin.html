<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Admin Panel | IR GAME RP</title>

<style>
body{
  font-family:sans-serif;
  background:#020617;
  color:#fff;
  padding:20px;
}
.box{
  max-width:420px;
  margin:auto;
  background:rgba(255,255,255,.08);
  padding:20px;
  border-radius:20px;
}
input,textarea,select,button{
  width:100%;
  margin:8px 0;
  padding:10px;
  border-radius:12px;
  border:none;
}
button{
  background:#22c55e;
  font-weight:bold;
  cursor:pointer;
}
.product{
  background:rgba(255,255,255,.1);
  padding:10px;
  border-radius:12px;
  margin-top:10px;
}
.del{
  background:#ef4444;
  color:#fff;
  margin-top:6px;
}
.hidden{display:none}
</style>
</head>

<body>

<div class="box" id="login">
  <h3>🔐 ورود ادمین</h3>
  <input id="user" placeholder="نام کاربری">
  <input id="pass" type="password" placeholder="رمز عبور">
  <button onclick="login()">ورود</button>
</div>

<div class="box hidden" id="panel">
  <h3>➕ افزودن محصول</h3>

  <input id="name" placeholder="نام محصول">
  <input id="price" placeholder="قیمت">
  <input id="img" placeholder="لینک عکس">
  <textarea id="desc" placeholder="توضیحات"></textarea>

  <select id="category">
    <option value="VIP">VIP</option>
    <option value="ماشین">ماشین</option>
    <option value="اکانت">اکانت</option>
    <option value="پول">پول بازی</option>
  </select>

  <button onclick="save()">💾 ذخیره محصول</button>

  <h3>📦 محصولات ثبت‌شده</h3>
  <div id="list"></div>
</div>

<script>
const USER="IRadmin46"
const PASS="Admin1234567890"

let products = JSON.parse(localStorage.getItem("products")) || []

function login(){
  if(user.value===USER && pass.value===PASS){
    login.classList.add("hidden")
    panel.classList.remove("hidden")
    render()
  }else alert("❌ اطلاعات اشتباه")
}

function save(){
  products.push({
    name:name.value,
    price:price.value,
    img:img.value,
    desc:desc.value,
    category:category.value
  })
  localStorage.setItem("products",JSON.stringify(products))
  render()
}

function del(i){
  products.splice(i,1)
  localStorage.setItem("products",JSON.stringify(products))
  render()
}

function render(){
  list.innerHTML=""
  products.forEach((p,i)=>{
    list.innerHTML+=`
      <div class="product">
        <b>${p.name}</b> | ${p.category}<br>
        💰 ${p.price}
        <button class="del" onclick="del(${i})">🗑 حذف</button>
      </div>
    `
  })
}
</script>

</body>
</html>
