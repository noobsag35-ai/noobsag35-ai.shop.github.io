<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Shop | IR GAME RP</title>

<style>
body{
  margin:0;
  background:#020617;
  color:#fff;
  font-family:sans-serif;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px;
}
header img{width:42px;border-radius:50%}
.btn{
  padding:10px 14px;
  border-radius:14px;
  background:#22c55e;
  color:#000;
  font-weight:bold;
  text-decoration:none;
}

.search, .cats{
  margin:10px;
}
input{
  width:100%;
  padding:12px;
  border-radius:14px;
  border:none;
}
.cats button{
  margin:4px;
  padding:8px 12px;
  border:none;
  border-radius:12px;
  background:#334155;
  color:#fff;
}

.shop{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
  padding:16px;
}

.card{
  background:rgba(255,255,255,.1);
  padding:14px;
  border-radius:18px;
}
.card img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:14px;
}
.buy{
  display:block;
  margin-top:10px;
  padding:12px;
  background:#3b82f6;
  text-align:center;
  border-radius:14px;
  color:#fff;
  text-decoration:none;
}
</style>
</head>

<body>

<header>
  <div>
    <img src="logo.png">
    IRAN GAME RP
  </div>
  <a class="btn" href="admin.html">🔐 ادمین</a>
</header>

<div class="search">
  <input id="q" placeholder="🔍 جستجو محصول..." oninput="render()">
</div>

<div class="cats">
  <button onclick="setCat('همه')">همه</button>
  <button onclick="setCat('VIP')">VIP</button>
  <button onclick="setCat('ماشین')">ماشین</button>
  <button onclick="setCat('اکانت')">اکانت</button>
  <button onclick="setCat('پول')">پول</button>
</div>

<div class="shop" id="shop"></div>

<script>
let products = JSON.parse(localStorage.getItem("products")) || []
let cat="همه"

function setCat(c){cat=c;render()}

function render(){
  shop.innerHTML=""
  const s=q.value.toLowerCase()
  products.filter(p=>{
    return (cat==="همه"||p.category===cat) &&
           p.name.toLowerCase().includes(s)
  }).forEach(p=>{
    shop.innerHTML+=`
      <div class="card">
        <img src="${p.img}">
        <b>${p.name}</b><br>
        💰 ${p.price}<br>
        <small>${p.desc}</small>
        <a class="buy" href="https://t.me/Shop_IR_GAME1" target="_blank">
          🛒 خرید
        </a>
      </div>
    `
  })
}
render()
</script>

</body>
</html>
